# Perfil de producao (ativado com SPRING_PROFILES_ACTIVE=prod).
# Os valores vem de variaveis de ambiente configuradas no servidor (ex.: Render).

# Porta: o Render informa a porta na variavel PORT
server.port=${PORT:8080}

# PostgreSQL. DATABASE_URL no formato JDBC: jdbc:postgresql://host:5432/nome_do_banco
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console do H2 nao existe em producao
spring.h2.console.enabled=false
