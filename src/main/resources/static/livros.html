<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livros - Biblioteca</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header id="topo"></header>

    <main class="conteudo">
        <h1>Livros</h1>

        <p id="mensagem" class="alerta" hidden></p>

        <!-- Formulario de cadastro/edicao: so aparece para ADMIN -->
        <section class="painel so-admin">
            <h2 id="titulo-form">Novo livro</h2>
            <form id="form-livro">
                <input type="hidden" id="livro-id">

                <div class="linha">
                    <div>
                        <label for="isbn">ISBN</label>
                        <div class="linha" style="flex-wrap:nowrap">
                            <input type="text" id="isbn" required>
                            <!-- Consulta a BrasilAPI e preenche titulo, editora e ano -->
                            <button type="button" id="buscar-isbn" style="flex:0; white-space:nowrap">Buscar ISBN</button>
                        </div>
                    </div>
                    <div>
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" required>
                    </div>
                </div>

                <div class="linha">
                    <div>
                        <label for="editora">Editora</label>
                        <input type="text" id="editora">
                    </div>
                    <div>
                        <label for="ano">Ano de publicação</label>
                        <input type="number" id="ano" min="0" max="3000">
                    </div>
                    <div>
                        <label for="categoria">Categoria</label>
                        <select id="categoria" required></select>
                    </div>
                </div>

                <label for="autores">Autores (segure Ctrl para escolher vários)</label>
                <select id="autores" multiple required></select>

                <div class="acoes-form">
                    <button type="submit">Salvar</button>
                    <button type="button" class="secundario" id="cancelar-edicao">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="painel">
            <form id="form-busca" class="linha">
                <input type="search" id="busca" placeholder="Buscar por título...">
                <div class="acoes-form" style="margin-top:0; flex:0">
                    <button type="submit">Buscar</button>
                    <button type="button" class="secundario" id="limpar-busca">Limpar</button>
                </div>
            </form>
        </section>

        <div class="tabela-rolagem">
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Autores</th>
                        <th>Categoria</th>
                        <th>Editora</th>
                        <th>Ano</th>
                        <th>ISBN</th>
                        <th class="so-admin">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-livros"></tbody>
            </table>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/livros.js"></script>
</body>
</html>
