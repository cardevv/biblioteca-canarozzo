<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorias - Biblioteca</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header id="topo"></header>

    <main class="conteudo">
        <h1>Categorias</h1>

        <p id="mensagem" class="alerta" hidden></p>

        <section class="painel so-admin">
            <h2 id="titulo-form">Nova categoria</h2>
            <form id="form-categoria">
                <input type="hidden" id="categoria-id">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>
                <div class="acoes-form">
                    <button type="submit">Salvar</button>
                    <button type="button" class="secundario" id="cancelar-edicao">Cancelar</button>
                </div>
            </form>
        </section>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th class="so-admin">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-categorias"></tbody>
        </table>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/categorias.js"></script>
</body>
</html>
